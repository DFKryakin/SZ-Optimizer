nname: Build and Sign SZ Optimizer Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-sign:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Standalone Single-File EXE
        run: dotnet publish SZOptimizer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o ./publish

      - name: Generate SHA-256 Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash ./publish/SZOptimizer.exe -Algorithm SHA256).Hash
          "$hash  SZOptimizer.exe" | Out-File -FilePath ./publish/SZOptimizer.exe.sha256 -Encoding ascii

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: './publish/SZOptimizer.exe'

      - name: Upload Signed Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./publish/SZOptimizer.exe
            ./publish/SZOptimizer.exe.sha256
